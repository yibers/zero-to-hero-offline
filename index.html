<script>

// ─── Haskell Type Parser & Unifier ───

// Tokenizer
function tokenize(sig) {
  const tokens = [];
  let i = 0;
  while (i < sig.length) {
    if (sig[i] === ' ') { i++; continue; }
    if (sig[i] === '(' && sig[i+1] === ')') { tokens.push('()'); i += 2; continue; }
    if (sig[i] === '(') {
      // Check for tuple comma or operator
      if (sig[i+1] === ',') {
        let j = i + 1;
        while (j < sig.length && sig[j] === ',') j++;
        if (sig[j] === ')') { tokens.push(sig.slice(i, j+1)); i = j+1; continue; }
      }
      tokens.push('('); i++; continue;
    }
    if (sig[i] === ')') { tokens.push(')'); i++; continue; }
    if (sig[i] === ',') { tokens.push(','); i++; continue; }
    if (sig[i] === '-' && sig[i+1] === '>') { tokens.push('->'); i += 2; continue; }
    if (sig[i] === '=' && sig[i+1] === '>') { tokens.push('=>'); i += 2; continue; }
    // Identifiers
    if (/[A-Za-z_]/.test(sig[i])) {
      let j = i;
      while (j < sig.length && /[A-Za-z0-9_]/.test(sig[j])) j++;
      tokens.push(sig.slice(i, j));
      i = j;
      continue;
    }
    i++;
  }
  return tokens;
}

// Parser
function parseType(sig) {
  const classes = {};
  if (sig.includes('=>')) {
    const [context, body, extra] = sig.split('=>');
    const constraint = context.trim().match(/^Applicative\s+([a-z][A-Za-z0-9_]*)$/);
    if (!constraint || extra !== undefined) throw new Error('Unsupported type constraint: ' + context.trim());
    classes[constraint[1]] = ['Applicative'];
    sig = body;
  }
  const tokens = tokenize(sig);
  let pos = 0;
  function peek() { return tokens[pos]; }
  function consume(t) { if (tokens[pos] === t) { pos++; return true; } return false; }
  function next() { return tokens[pos++]; }

  function parseArrow() {
    const left = parseApp();
    if (peek() === '->') {
      next();
      const right = parseArrow();
      return { tag: 'fun', from: left, to: right };
    }
    return left;
  }

  function parseApp() {
    let base = parseAtom();
    if (!base) return null;
    while (pos < tokens.length && peek() !== ')' && peek() !== ',' && peek() !== '->') {
      const arg = parseAtom();
      if (!arg) break;
      base = { tag: 'app', con: base, arg: arg };
    }
    return base;
  }

  function parseAtom() {
    const t = peek();
    if (!t || t === ')' || t === ',' || t === '->') return null;
    if (t === '(') {
      next(); // consume '('
      const inner = parseArrow();
      if (peek() === ',') {
        // Tuple
        const elems = [inner];
        while (consume(',')) {
          elems.push(parseArrow());
        }
        consume(')');
        return makeTuple(elems);
      }
      consume(')');
      return inner;
    }
    if (t === '()') {
      next();
      return { tag: 'con', name: '()' };
    }
    next();
    if (t[0] >= 'A' && t[0] <= 'Z') {
      return { tag: 'con', name: t };
    }
    return { tag: 'var', name: t, ...(classes[t] ? { classes: classes[t] } : {}) };
  }

  function makeTuple(elems) {
    let t = { tag: 'con', name: `(${','.repeat(elems.length - 1)})` };
    for (const e of elems) {
      t = { tag: 'app', con: t, arg: e };
    }
    return t;
  }

  const result = parseArrow();
  return result;
}

// Unifier
let substCounter = 0;
const SUBST_CLASSES = Symbol('type-class constraints');

function freshVar() {
  return { tag: 'var', name: `_t${substCounter++}` };
}

function freshen(type, mapping = {}) {
  if (!type) return null;
  switch (type.tag) {
    case 'var':
      if (!mapping[type.name]) mapping[type.name] = { ...freshVar(), ...(type.classes ? { classes: type.classes } : {}) };
      return mapping[type.name];
    case 'con':
      return type;
    case 'app':
      return { tag: 'app', con: freshen(type.con, mapping), arg: freshen(type.arg, mapping) };
    case 'fun':
      return { tag: 'fun', from: freshen(type.from, mapping), to: freshen(type.to, mapping) };
  }
}

function applySubst(subst, type) {
  switch (type.tag) {
    case 'var':
      if (subst[type.name]) return applySubst(subst, subst[type.name]);
      const classes = [...new Set([...(type.classes || []), ...(subst[SUBST_CLASSES]?.[type.name] || [])])];
      return classes.length ? { ...type, classes } : type;
    case 'con':
      return type;
    case 'app': {
      const con = applySubst(subst, type.con), arg = applySubst(subst, type.arg);
      // The function Applicative binds f to ((->) r). Keep fully applied
      // arrows in the same form as parsed arrows for inference and diagrams.
      if (con.tag === 'app' && con.con.tag === 'con' && con.con.name === '->') {
        return { tag: 'fun', from: con.arg, to: arg };
      }
      return { tag: 'app', con, arg };
    }
    case 'fun':
      return { tag: 'fun', from: applySubst(subst, type.from), to: applySubst(subst, type.to) };
  }
}

function occursIn(name, type, subst) {
  type = applySubst(subst, type);
  switch (type.tag) {
    case 'var': return type.name === name;
    case 'con': return false;
    case 'app': return occursIn(name, type.con, subst) || occursIn(name, type.arg, subst);
    case 'fun': return occursIn(name, type.from, subst) || occursIn(name, type.to, subst);
  }
}

// The game currently supplies two Applicative instances: unary Hero and
// functions with a shared input. Other data declarations do not acquire an
// instance merely by having a type parameter.
function hasTypeClass(type, name) {
  return name === 'Applicative' && ((type.tag === 'con' && type.name === 'Hero')
    || (type.tag === 'app' && type.con.tag === 'con' && type.con.name === '->'));
}
function unify(a, b, subst) {
  a = applySubst(subst, a);
  b = applySubst(subst, b);
  if (a.tag === 'var') {
    const classes = [...new Set([...(a.classes || []), ...(b.tag === 'var' ? b.classes || [] : [])])];
    if (b.tag === 'var') {
      subst = { ...subst, [SUBST_CLASSES]: { ...subst[SUBST_CLASSES], [b.name]: classes } };
      if (a.name === b.name) return subst;
    } else if (classes.some(name => !hasTypeClass(b, name))) return null;
    if (occursIn(a.name, b, subst)) return null;
    return { ...subst, [a.name]: b };
  }
  if (b.tag === 'var') return unify(b, a, subst);
  if (a.tag === 'con' && b.tag === 'con') return a.name === b.name ? subst : null;
  if (a.tag === 'fun' && b.tag === 'fun') {
    subst = unify(a.from, b.from, subst);
    return subst && unify(a.to, b.to, subst);
  }
  // Match a -> b with f b by binding f to the partially applied (->) a.
  // Decompose here rather than recursing on a normalized full arrow again.
  const asApp = type => type.tag === 'fun'
    ? { tag: 'app', con: { tag: 'app', con: { tag: 'con', name: '->' }, arg: type.from }, arg: type.to }
    : type;
  a = asApp(a); b = asApp(b);
  if (a.tag === 'app' && b.tag === 'app') {
    subst = unify(a.con, b.con, subst);
    return subst && unify(a.arg, b.arg, subst);
  }
  return null;
}

function typeToString(type) {
  switch (type.tag) {
    case 'var': return type.name;
    case 'con': return type.name;
    case 'fun': {
      const from = type.from.tag === 'fun' ? `(${typeToString(type.from)})` : typeToString(type.from);
      return `${from} -> ${typeToString(type.to)}`;
    }
    case 'app': {
      // Check for tuple
      const flat = flattenApp(type);
      if (flat.head.tag === 'con' && flat.head.name.startsWith('(') && flat.head.name.endsWith(')')) {
        const commas = (flat.head.name.match(/,/g) || []).length;
        if (commas + 1 === flat.args.length) {
          return `(${flat.args.map(typeToString).join(', ')})`;
        }
      }
      function isTuple(t) {
        if (t.tag !== 'app') return false;
        const f = flattenApp(t);
        return f.head.tag === 'con' && f.head.name.startsWith('(') && f.head.name.endsWith(')') && (f.head.name.match(/,/g) || []).length + 1 === f.args.length;
      }
      const needsParens = (type.arg.tag === 'app' && !isTuple(type.arg)) || type.arg.tag === 'fun';
      const argStr = needsParens ? `(${typeToString(type.arg)})` : typeToString(type.arg);
      return `${typeToString(type.con)} ${argStr}`;
    }
  }
}

function flattenApp(type) {
  const args = [];
  let cur = type;
  while (cur.tag === 'app') {
    args.unshift(cur.arg);
    cur = cur.con;
  }
  return { head: cur, args };
}

// ─── Expression Parser (minimal Haskell) ───
// Supports: function application, ($), (.), (<$>), (<*>), parens

function tokenizeExpr(code) {
  const tokens = [];
  let i = 0;
  while (i < code.length) {
    if (code[i] === ' ' || code[i] === '\n' || code[i] === '\r' || code[i] === '\t') { i++; continue; }
    if (code[i] === '(') { tokens.push('('); i++; continue; }
    if (code[i] === ')') { tokens.push(')'); i++; continue; }
    if (code[i] === '$') { tokens.push('$'); i++; continue; }
    if (code[i] === '`') {
      let j = i + 1;
      while (j < code.length && code[j] !== '`') j++;
      tokens.push({ type: 'infix', name: code.slice(i+1, j) });
      i = j + 1;
      continue;
    }
    if (code[i] === '.') { tokens.push('.'); i++; continue; }
    if (code.slice(i, i+3) === '>>=') { tokens.push('>>='); i += 3; continue; }
    if (code.slice(i, i+3) === '<$>') { tokens.push('<$>'); i += 3; continue; }
    if (code.slice(i, i+3) === '<*>') { tokens.push('<*>'); i += 3; continue; }
    if (/[A-Za-z_]/.test(code[i])) {
      let j = i;
      while (j < code.length && /[A-Za-z0-9_']/.test(code[j])) j++;
      const word = code.slice(i, j);
      if (word === 'undefined') { tokens.push({ type: 'undefined' }); }
      else tokens.push({ type: 'ident', name: word });
      i = j;
      continue;
    }
    throw new Error(`Unexpected character '${code[i]}'`);
  }
  return tokens;
}

// ─── Shared Validation ───

function validateCode(fullCode) {
  if (fullCode.includes('undefined')) {
    return 'Using undefined is not allowed.';
  }
  if (fullCode.slice(1).includes('zeroToHero')) {
    return 'Cannot recursively define the function.';
  }
  return null;
}

function normalizeTypeError(msg) {
  if (msg.includes('Unknown identifier')) {
    return 'Your definition contains function(s) that are not in the available functions.';
  }
  if (msg.includes('Cannot apply') || msg.includes('Type mismatch')) {
    return 'Your definition is not well-typed.';
  }
  if (msg.includes('Cannot read properties of null') || msg.includes('Cannot read properties of undefined') ||
      msg.includes("can't access property") || msg.includes('null is not an object') ||
      msg.includes('Incomplete expression')) {
    return 'Incomplete expression.';
  }
  if (msg.includes('not available')) {
    return 'Your definition contains function(s) that are not available for this level.';
  }
  return msg;
}

// ─── Live Type Inference (runs on every keystroke) ───

function liveInfer(levelData, code) {
  substCounter = 0;
  const fullCode = code.trim();
  if (!fullCode || fullCode === 'undefined') {
    return { valid: false, typeSig: null, error: null };
  }

  const validationError = validateCode(fullCode);
  if (validationError) {
    return { valid: false, typeSig: null, error: validationError };
  }

  const env = {};
  for (const f of levelData.funcs) {
    env[f.name] = parseType(f.sig);
    const bare = f.name.replace(/^\(/, '').replace(/\)$/, '');
    if (bare !== f.name) env[bare] = parseType(f.sig);
  }

  const lhsParts = levelData.lhs.replace('=', '').trim().split(/\s+/);
  const paramNames = lhsParts.slice(1);
  const targetType = parseType(levelData.target);

  // Use skolem constants for parameter types (so inferred types show _a, _b, etc.)
  const skolemSubst = {};
  for (const v of findVars(targetType)) {
    skolemSubst[v] = { tag: 'con', name: `SKOLEM${v}` };
  }
  let skolemTarget = applySubst(skolemSubst, targetType);
  let skolemRemaining = skolemTarget;
  const skolemParamTypes = {};
  for (const p of paramNames) {
    if (skolemRemaining.tag === 'fun') {
      skolemParamTypes[p] = skolemRemaining.from;
      skolemRemaining = skolemRemaining.to;
    }
  }

  try {
    const inferredType = inferExpr(fullCode, env, skolemParamTypes);
    if (!inferredType) {
      return { valid: false, typeSig: null, error: 'Could not parse expression.' };
    }

    // Build the full function type: params -> inferred return
    let fullType = applySubst({}, inferredType);
    // Prepend parameter types to form the full signature
    for (let i = paramNames.length - 1; i >= 0; i--) {
      fullType = { tag: 'fun', from: skolemParamTypes[paramNames[i]], to: fullType };
    }

    // Convert to string, clean up variable names
    let sigStr = typeToString(fullType).replace(/SKOLEM/g, '');
    // Rename internal vars (_t0, _t1...) to clean letters
    const usedNames = new Set(sigStr.match(/\b[a-z]\b/g) || []);
    const internalVars = [...new Set(sigStr.match(/_t\d+/g) || [])];
    let nextChar = 'a'.charCodeAt(0);
    for (const v of internalVars) {
      while (usedNames.has(String.fromCharCode(nextChar))) nextChar++;
      const clean = String.fromCharCode(nextChar++);
      sigStr = sigStr.split(v).join(clean);
      usedNames.add(clean);
    }

    return { valid: true, typeSig: sigStr, error: null };
  } catch (e) {
    return { valid: false, typeSig: null, error: normalizeTypeError(e.message) };
  }
}

// ─── Target type checker (completion also checks required function usage) ───

function typeCheck(levelData, code) {
  substCounter = 0;
  const fullCode = code.trim();
  if (!fullCode || fullCode === 'undefined') {
    return { ok: false, msg: 'You did not make any changes.' };
  }

  const validationError = validateCode(fullCode);
  if (validationError) {
    return { ok: false, msg: validationError };
  }

  // Build environment: the available functions + the lhs parameters
  const env = {};
  for (const f of levelData.funcs) {
    env[f.name] = parseType(f.sig);
    // Also store operators without parens
    const bare = f.name.replace(/^\(/, '').replace(/\)$/, '');
    if (bare !== f.name) {
      env[bare] = parseType(f.sig);
    }
  }

  // Parse the LHS to get parameter names and their types from the target signature
  const lhsParts = levelData.lhs.replace('=', '').trim().split(/\s+/);
  const paramNames = lhsParts.slice(1);

  const targetType = parseType(levelData.target);

  // Assign types to parameters by decomposing target
  const paramTypes = {};
  let remainingTarget = freshen(targetType);
  for (const p of paramNames) {
    if (remainingTarget.tag === 'fun') {
      paramTypes[p] = remainingTarget.from;
      remainingTarget = remainingTarget.to;
    }
  }
  const expectedReturnType = remainingTarget;

  // Now we need to infer the type of the RHS expression
  try {
    const exprType = inferExpr(fullCode, env, paramTypes);
    if (!exprType) {
      return { ok: false, msg: 'Could not parse expression.' };
    }

    // Check if the inferred type unifies with expected return type
    // But we need to use skolem variables for the check
    // Create skolem constants for each type var in the target
    const skolemSubst = {};
    const targetFresh = parseType(levelData.target);
    const skolemVars = findVars(targetFresh);
    for (const v of skolemVars) {
      skolemSubst[v] = { tag: 'con', name: `SKOLEM${v}` };
    }

    // Re-do with skolems
    substCounter = 0;
    let skolemTarget = applySubst(skolemSubst, targetFresh);
    let skolemRemaining = skolemTarget;
    const skolemParamTypes = {};
    for (const p of paramNames) {
      if (skolemRemaining.tag === 'fun') {
        skolemParamTypes[p] = skolemRemaining.from;
        skolemRemaining = skolemRemaining.to;
      }
    }
    const skolemExpectedReturn = skolemRemaining;

    const inferredType = inferExpr(fullCode, env, skolemParamTypes);
    if (!inferredType) {
      return { ok: false, msg: 'Could not infer type of expression.' };
    }

    const subst = unify(inferredType, skolemExpectedReturn, {});
    if (!subst) {
      const inferred = typeToString(applySubst({}, inferredType));
      const expected = typeToString(skolemExpectedReturn);
      return { ok: false, msg: `Type mismatch:\n  Expected: ${expected}\n  Got:      ${inferred}` };
    }

    return { ok: true, msg: 'Level complete! Your solution type-checks correctly.' };

  } catch (e) {
    return { ok: false, msg: normalizeTypeError(e.message) };
  }
}

function findVars(type) {
  const vars = new Set();
  function go(t) {
    switch (t.tag) {
      case 'var': vars.add(t.name); break;
      case 'con': break;
      case 'app': go(t.con); go(t.arg); break;
      case 'fun': go(t.from); go(t.to); break;
    }
  }
  go(type);
  return vars;
}

function inferExpr(code, env, paramTypes) {
  const program = RowProgram.parseLet(code);
  if (program) {
    const localEnv = { ...env };
    const defined = new Set(Object.keys(paramTypes));
    for (const binding of program.bindings) {
      if (defined.has(binding.id) || Object.hasOwn(env, binding.id)) throw new Error('A row cannot shadow an available name.');
      const type = inferExpr(binding.expr, localEnv, paramTypes);
      if (!type) throw new Error('Incomplete expression.');
      localEnv[binding.id] = type;
      defined.add(binding.id);
    }
    return inferExpr(program.final, localEnv, paramTypes);
  }
  const tokens = tokenizeExpr(code);
  let pos = 0, inferenceSubst = {};

  function peek() { return tokens[pos]; }
  function next() { return tokens[pos++]; }
  function isOp(t) {
    return t === '$' || t === '.' || t === '<$>' || t === '<*>' || t === '>>=' ||
           (typeof t === 'object' && t.type === 'infix');
  }

  function parseExprFull() {
    return parseDollar();
  }

  function parseDollar() {
    let left = parseBind();
    while (peek() === '$') {
      next();
      const right = parseDollar(); // right-assoc
      // f $ x  means  f x
      left = applyFuncType(left, right);
    }
    return left;
  }

  function parseBind() {
    let left = parseOps();
    while (peek() === '>>=') {
      next();
      const right = parseOps(); // left-assoc
      const bindType = freshen(env['>>='] || env['(>>=)']);
      if (!bindType) throw new Error('(>>=) not available');
      left = applyBinOp(bindType, left, right);
    }
    return left;
  }

  function parseOps() {
    let left = parseAppChain();
    while (true) {
      const t = peek();
      if (t === '<$>') {
        next();
        const right = parseAppChain();
        // (<$>) :: (a -> b) -> F a -> F b
        // left is the function, right is F a
        const fType = freshen(env['<$>'] || env['(<$>)']);
        if (!fType) throw new Error('(<$>) not available');
        left = applyBinOp(fType, left, right);
      } else if (t === '<*>') {
        next();
        const right = parseAppChain();
        const fType = freshen(env['<*>'] || env['(<*>)']);
        if (!fType) throw new Error('(<*>) not available');
        left = applyBinOp(fType, left, right);
      } else if (t === '.') {
        next();
        const right = parseOps(); // right-assoc
        // (.) :: (b -> c) -> (a -> b) -> a -> c
        const compType = freshen(env['.'] || env['(.)']);
        if (!compType) throw new Error('(.) not available');
        left = applyBinOp(compType, left, right);
      } else {
        break;
      }
    }
    return left;
  }

  function parseAppChain() {
    let func = parseAtomExpr();
    if (!func) return null;
    while (pos < tokens.length) {
      const t = peek();
      if (!t || t === '$' || t === '.' || t === '<$>' || t === '<*>' || t === '>>=' || t === ')') break;
      const arg = parseAtomExpr();
      if (!arg) break;
      func = applyFuncType(func, arg);
    }
    return func;
  }

  function parseAtomExpr() {
    const t = peek();
    if (!t) return null;
    if (t === '(') {
      next();
      // Check for operator section
      const inner = peek();
      if (inner === ')') { next(); return null; }
      if (inner === '.' || inner === '$' || inner === '<$>' || inner === '<*>' || inner === '>>=') {
        const opName = next();
        if (peek() === ')') {
          next();
          const opType = env[opName] || env[`(${opName})`];
          if (opType) return freshen(opType);
          throw new Error(`Unknown operator: ${opName}`);
        }
      }
      const expr = parseExprFull();
      if (peek() !== ')') throw new Error('Expected closing parenthesis');
      next();
      return expr;
    }
    if (typeof t === 'object' && t.type === 'ident') {
      next();
      const name = t.name;
      if (paramTypes[name]) return paramTypes[name];
      if (env[name]) return freshen(env[name]);
      throw new Error(`Unknown identifier: ${name}`);
    }
    if (typeof t === 'object' && t.type === 'undefined') {
      next();
      return freshVar();
    }
    if (typeof t === 'object' && t.type === 'infix') {
      throw new Error(`Backtick infix syntax is not supported: \`${t.name}\``);
    }
    return null;
  }

  function applyFuncType(funcType, argType) {
    // funcType should be a -> b, unify a with argType, return b
    const a = freshVar();
    const b = freshVar();
    const arrow = { tag: 'fun', from: a, to: b };
    const subst = unify(funcType, arrow, inferenceSubst);
    if (!subst) {
      throw new Error(`Cannot apply: not a function type\n  ${typeToString(funcType)}`);
    }
    const paramType = applySubst(subst, a);
    const subst2 = unify(paramType, argType, subst);
    if (!subst2) {
      throw new Error(`Type mismatch in application:\n  Expected argument: ${typeToString(paramType)}\n  Got: ${typeToString(argType)}`);
    }
    inferenceSubst = subst2;
    return applySubst(subst2, b);
  }

  function applyBinOp(opType, left, right) {
    // opType :: a -> b -> c, apply to left and right
    const afterLeft = applyFuncType(opType, left);
    return applyFuncType(afterLeft, right);
  }

  const result = parseExprFull();
  if (pos < tokens.length) {
    const remaining = tokens[pos];
    const desc = typeof remaining === 'object' ? (remaining.name || remaining.type) : String(remaining);
    throw new Error(`Unexpected trailing token: ${desc}`);
  }
  return result && applySubst(inferenceSubst, result);
}


// ─── UI Rendering ───

let currentLevel = LEVEL_ORDER[0];
let showComplete = false;
let showAbout = false;
let completedLevels = new Set();
let editorContents = {};
let rowPrograms = {};
let textDrafts = {};
let activeRow = 0;
let geckoOn = false;
let iconMode = true;

// Load progress from localStorage
try {
  const saved = localStorage.getItem('zth_progress');
  if (saved) {
    const parsed = JSON.parse(saved);
    // Version 1 inserts the composition introduction after the old level 2.
    // Move every saved field together so later work still belongs to its puzzle.
    if ((parsed.levelOrderVersion || 0) < 1) {
      const shift = index => Number(index) >= 2 ? Number(index) + 1 : Number(index);
      for (const key of ['editorContents', 'rowPrograms', 'textDrafts']) {
        if (parsed[key] && typeof parsed[key] === 'object') {
          parsed[key] = Object.fromEntries(Object.entries(parsed[key]).map(([index, value]) => [shift(index), value]));
        }
      }
      if (Array.isArray(parsed.completed)) parsed.completed = parsed.completed.map(shift);
      if (parsed.currentLevel != null) parsed.currentLevel = shift(parsed.currentLevel);
    }
    // Version 2 removes Assembly required (old index 1). Keep every other
    // puzzle's drafts and progress together; a player on that level continues
    // at Assembly by composition, without inheriting the removed completion.
    if ((parsed.levelOrderVersion || 0) < 2) {
      const shift = index => Number(index) > 1 ? Number(index) - 1 : Number(index);
      for (const key of ['editorContents', 'rowPrograms', 'textDrafts']) {
        if (parsed[key] && typeof parsed[key] === 'object') {
          parsed[key] = Object.fromEntries(Object.entries(parsed[key])
            .filter(([index]) => Number(index) !== 1).map(([index, value]) => [shift(index), value]));
        }
      }
      if (Array.isArray(parsed.completed)) parsed.completed = parsed.completed.filter(index => Number(index) !== 1).map(shift);
      if (parsed.currentLevel != null) parsed.currentLevel = shift(parsed.currentLevel);
    }
    completedLevels = new Set(parsed.completed || []);
    editorContents = parsed.editorContents || {};
    const middleManIndex = LEVELS.findIndex(level => level.name === 'The middle man');
    if (parsed.middleManVersion !== 1 && typeof editorContents[middleManIndex] === 'string') {
      editorContents[middleManIndex] = editorContents[middleManIndex]
        .replace(/^zeroToHero\s+ad\s+bd\s+cd\s+z\s*=/, LEVELS[middleManIndex].lhs);
    }
    if (parsed.textDrafts && typeof parsed.textDrafts === 'object') {
      for (const [key, value] of Object.entries(parsed.textDrafts)) {
        if (typeof value === 'string') textDrafts[key] = value;
      }
    }
    if (parsed.rowVersion === 1 && parsed.rowPrograms && typeof parsed.rowPrograms === 'object') {
      for (const [key, rows] of Object.entries(parsed.rowPrograms)) {
        if (Array.isArray(rows) && rows.length && rows.every(r => r && /^[a-z][A-Za-z0-9_']*$/.test(r.id) && typeof r.expr === 'string') && new Set(rows.map(r => r.id)).size === rows.length) rowPrograms[key] = rows;
      }
    }
    currentLevel = Math.max(0, Math.min(parsed.currentLevel ?? LEVEL_ORDER[0], LEVELS.length - 1));
    iconMode = parsed.iconMode !== false;
    // Preserve the meaning of solutions saved by the old implicit-$ editor.
    // New edits and every later reload use ordinary application in both modes.
    if (parsed.connectionVersion !== 1 && parsed.iconMode === true) {
      for (const key of Object.keys(editorContents)) {
        const index = Number(key), level = LEVELS[index];
        if (level && typeof editorContents[key] === 'string') {
          setEditorContent(withLegacyConnections(getEditorContent(index), level), index);
        }
      }
    }
    // Expand older calls into unary steps while retaining result names,
    // unfinished drafts, achievements and the player's current level.
    if (parsed.curryingVersion !== 1) {
      for (const key of Object.keys(editorContents)) {
        if (LEVELS[key] && typeof editorContents[key] === 'string') {
          const source = getEditorContent(Number(key));
          const curried = RowProgram.currySource(source);
          if (curried !== source) editorContents[key] = LEVELS[key].lhs.trim() + ' ' + curried;
        }
      }
      for (const key of Object.keys(textDrafts)) textDrafts[key] = RowProgram.currySource(textDrafts[key]);
      for (const key of Object.keys(rowPrograms)) rowPrograms[key] = RowProgram.curryRows(rowPrograms[key]);
    }
    if (parsed.applicativeVersion !== 1) {
      const index = LEVELS.findIndex(level => level.name === 'TIE fighter');
      const code = textDrafts[index] ?? (rowPrograms[index] ? RowProgram.source(rowPrograms[index])
        : RowProgram.source(RowProgram.migrate(getEditorContent(index))));
      if (!checkSolution(LEVELS[index], code).ok) completedLevels.delete(index);
    }
    // The final five puzzles now build functions before using z. Retain old
    // work for editing, but recheck only these changed achievements once.
    if (parsed.transformationsVersion !== 1) {
      for (const index of [...completedLevels]) {
        if (LEVELS[index]?.level < 12) continue;
        try {
          const code = iconMode && rowPrograms[index] ? RowProgram.source(rowPrograms[index])
            : textDrafts[index] ?? RowProgram.source(RowProgram.migrate(getEditorContent(index)));
          if (!checkSolution(LEVELS[index], code).ok) completedLevels.delete(index);
        } catch (_) { completedLevels.delete(index); }
      }
    }
    // bd is now a required palette function; ad/cd are no longer inputs. Keep
    // drafts, and retain an old completion only if its current source is valid.
    if (parsed.middleManVersion !== 1 && completedLevels.has(middleManIndex)) {
      const code = iconMode && rowPrograms[middleManIndex] ? RowProgram.source(rowPrograms[middleManIndex])
        : textDrafts[middleManIndex] ?? getEditorContent(middleManIndex);
      if (!checkSolution(LEVELS[middleManIndex], code).ok) completedLevels.delete(middleManIndex);
    }
    // Recheck old achievements against the current learning requirements;
    // keep all saved work and preferences so it can still be edited.
    if (parsed.completionVersion !== 5) {
      completedLevels = new Set([...completedLevels].filter(index => {
        if (!LEVELS[index]) return false;
        try {
          const code = textDrafts[index] ?? (rowPrograms[index] ? RowProgram.source(rowPrograms[index])
            : RowProgram.source(RowProgram.migrate(getEditorContent(index))));
          return checkSolution(LEVELS[index], code).ok;
        } catch (_) { return false; }
      }));
    }
    if (parsed.connectionVersion !== 1 || parsed.completionVersion !== 5 || parsed.levelOrderVersion !== 2 || parsed.curryingVersion !== 1 || parsed.applicativeVersion !== 1 || parsed.transformationsVersion !== 1 || parsed.middleManVersion !== 1 || 'bypassCount' in parsed) saveProgress();
  }
} catch(e) {}

function saveProgress() {
  localStorage.setItem('zth_progress', JSON.stringify({

  const stock = functionUsage(level, code), key = JSON.stringify(stock.map(f => f.remaining));
  if (palette.dataset.stock === key) return;
  palette.dataset.stock = key;
  palette.innerHTML = stock.map((entry, i) => {
    if (!entry.remaining) return '';
    const f = level.funcs[i], label = `${f.name}: ${entry.remaining} of ${entry.limit} copies remaining`;
    return `<div class="func-card"${iconMode ? ' role="button" tabindex="0"' : ''} draggable="true" data-func-name="${f.name}" data-remaining="${entry.remaining}" title="${escHtml(label)}" aria-label="${escHtml(label)}">

  }).join('');

}

function getEditorContent(levelIndex = currentLevel) {
  const lhs = LEVELS[levelIndex].lhs.trim();
  if (editorContents[levelIndex] === undefined) {
    editorContents[levelIndex] = lhs + ' undefined';
  }
  // Keep full definitions in saved progress so existing solutions still load.
  const full = editorContents[levelIndex];
  if (full.startsWith(lhs)) {
    const rhs = full.slice(lhs.length);
    return rhs.startsWith(' ') ? rhs.slice(1) : rhs.trimStart();
  }
  return full;
}

function setEditorContent(value, levelIndex = currentLevel) {
  editorContents[levelIndex] = LEVELS[levelIndex].lhs.trim() + ' ' + value;
  delete rowPrograms[levelIndex];
  delete textDrafts[levelIndex];
  textHistory.delete(levelIndex);
}

// Shared source tokens for connector cleanup and migration of old saved code.
function isOperatorName(name) {
  return /^\([^a-zA-Z0-9_]+\)$/.test(name);
}

function connectionTokens(text) {
  return Array.from(text.matchAll(/[a-zA-Z_][a-zA-Z0-9_']*|[!@#$%^&*\-+=<>?/|~:.\\]+|\S/g));
}

// Used only to migrate progress from the former implicit-connection editor.
function withLegacyConnections(text, level) {
  const functions = new Set(level.funcs.map(f => f.name).filter(name => /^[a-zA-Z_]/.test(name)));
  const params = new Set(level.lhs.split('=')[0].trim().split(/\s+/).slice(1));
  const scopes = [];
  let hasFunction = false, end = 0, code = '';
  for (const token of connectionTokens(text)) {
    const name = token[0];
    const gap = text.slice(end, token.index);
    code += gap;
    if (functions.has(name)) {
      if (hasFunction) code += (gap ? '' : ' ') + '$ ';
      hasFunction = true;
    } else if (params.has(name)) {
      // Parameters (including function-valued ones such as bd) stay arguments
      // of the preceding function; a later function starts the next step.
    } else if (name === '(') {
      scopes.push(hasFunction);
      hasFunction = false;
    } else if (name === ')') {
      hasFunction = scopes.pop() || false;
    } else {
      // An explicit operator or unrecognized token ends the implicit chain.
      hasFunction = false;
    }
    code += name;
    end = token.index + name.length;
  }
  return code + text.slice(end);
}

function functionRemovalRange(text, range, level) {
  const name = text.slice(range.start, range.end);
  if (!level.funcs.some(f => f.name === name)) return range;
  const tokens = connectionTokens(text);
  const index = tokens.findIndex(t => t.index === range.start);
  const connectors = new Set(['$', '.', '<$>', '<*>', '>>=']);
  const next = tokens[index + 1], prev = tokens[index - 1];
  // Prefer the outgoing connector. For the last function, remove the incoming
  // one instead. Parameters and parentheses remain where the player put them.
  if (next && connectors.has(next[0])) return { start: range.start, end: next.index + next[0].length };
  if (prev && connectors.has(prev[0])) return { start: prev.index, end: range.end };
  return range;
}

// ─── Expression Tree Parser (for nested gecko rendering) ───

function parseExprTree(rhs) {
  const tokens = (rhs.match(/[a-zA-Z_][a-zA-Z0-9_']*|[()[\]{}]|[!@#$%^&*\-+=<>?/|~:.\\]+|\s+|./g) || [])
    .filter(t => !/^\s+$/.test(t) && t !== 'undefined');
  if (tokens.length === 0) return null;
  let pos = 0;

  function parseDollar() {
    let left = parseDot();
    if (pos < tokens.length && tokens[pos] === '$') {
      pos++;
      const right = parseDollar(); // right-assoc
      return { type: 'app', func: left, arg: right };
    }
    return left;
  }

  function parseDot() {
    let left = parseOps();
    if (pos < tokens.length && tokens[pos] === '.') {
      pos++;
      const right = parseDot(); // right-assoc
      return { type: 'comp', left, right };
    }
    return left;
  }

  function parseOps() {
    let left = parseAppChain();
    while (pos < tokens.length) {
      const t = tokens[pos];
      if (t === '<$>' || t === '<*>' || t === '>>=') {
        const op = t; pos++;
        const right = parseAppChain();
        left = { type: 'binop', op, left, right };
      } else break;
    }
    return left;
  }

  function parseAppChain() {
    let base = parseAtom();
    if (!base) return null;
    while (pos < tokens.length) {
      const t = tokens[pos];
      if (!t || t === ')' || t === '$' || t === '.' ||
          t === '<$>' || t === '<*>' || t === '>>=' ||
          /^[!@#$%^&*\-+=<>?/|~:.\\]+$/.test(t)) break;
      const arg = parseAtom();
      if (!arg) break;
      base = { type: 'app', func: base, arg: arg };
    }
    return base;
  }

  function parseAtom() {
    if (pos >= tokens.length) return null;
    const t = tokens[pos];
    if (!t || t === ')') return null;
    if (/^[!@#$%^&*\-+=<>?/|~:.\\]+$/.test(t) && t !== '(' && t !== ')') return null;
    if (t === '(') {
      pos++;
      if (pos < tokens.length && tokens[pos] === ')') { pos++; return null; }
      const inner = parseDollar();
      if (pos < tokens.length && tokens[pos] === ')') pos++;
      return inner;
    }
    pos++;
    return { type: 'leaf', name: t };
  }

  const result = parseDollar();
  if (pos !== tokens.length) return null;
  return result;
}

// Flatten an application tree to get head function and args list
function flattenAppTree(tree) {
  const args = [];
  let head = tree;
  while (head && head.type === 'app') {
    args.unshift(head.arg);
    head = head.func;
  }
  return { head, args };
}

// Desugar composition: (f . g) applied to args → f(g(args[0])) args[1:]
function desugarComp(compNode, args) {
  if (args.length === 0) return null; // unapplied composition
  let inner = { type: 'app', func: compNode.right, arg: args[0] };
  let outer = { type: 'app', func: compNode.left, arg: inner };
  for (let i = 1; i < args.length; i++) {
    outer = { type: 'app', func: outer, arg: args[i] };
  }
  return outer;
}

// ─── Nested Gecko Renderer ───

const geckoChevron = `<svg viewBox="0 0 39 18" fill="white" style="height:10px"><path d="M1 1H7L15.5 9H9.5L1 1Z"/><path d="M1 17H7L15.5 9H9.5L1 17Z"/><path d="M12.5 1H18.5L27 9H21L12.5 1Z"/><path d="M12.5 17H18.5L27 9H21L12.5 17Z"/><path d="M24 1H30L38.5 9H32.5L24 1Z"/><path d="M24 17H30L38.5 9H32.5L24 17Z"/></svg>`;

function flattenExprChain(tree, funcSigMap, paramTypeMap, bareFuncs, params) {
  if (!tree) return null;

  // Leaf param: start of chain
  if (tree.type === 'leaf' && params.has(tree.name) && paramTypeMap[tree.name]) {
    return [{ type: paramTypeMap[tree.name], label: tree.name, cls: 'editor-slot-param' }];
  }

  // Function application
  if (tree.type === 'app') {
    const { head, args } = flattenAppTree(tree);

    if (head && head.type === 'comp') {
      const desugared = desugarComp(head, args);
      if (desugared) return flattenExprChain(desugared, funcSigMap, paramTypeMap, bareFuncs, params);
    }

    if (head && head.type === 'leaf' && funcSigMap[head.name]) {
      const funcType = freshen(parseType(funcSigMap[head.name]));
      const parts = [];
      let cur = funcType;
      while (cur.tag === 'fun') { parts.push(cur.from); cur = cur.to; }
      parts.push(cur);

      // Single-arg fully applied — chainable
      if (args.length === 1 && parts.length === 2) {
        const inner = flattenExprChain(args[0], funcSigMap, paramTypeMap, bareFuncs, params);
        if (inner) {
          // Unify this function's input with previous step's output
          const prevOutput = inner[inner.length - 1].type;
          const subst = unify(parts[0], prevOutput, {});
          if (!subst) return null; // type mismatch breaks the chain
          const outputType = applySubst(subst, parts[1]);
          return [...inner, { type: outputType, label: head.name, cls: 'editor-slot-func' }];
        }
      }
    }
  }

  return null;
}

function renderExprTreeGecko(tree, funcSigMap, paramTypeMap, bareFuncs, params) {
  if (!tree) return '';

  if (tree.type === 'leaf') {
    if (bareFuncs.has(tree.name) && funcSigMap[tree.name]) {
      return `<div class="editor-token editor-token-func"><div class="token-label">${symbolDisplay(tree.name)}</div><div style="margin-top:3px">${renderGeckoType(parseType(funcSigMap[tree.name]))}</div></div>`;
    }
    if (params.has(tree.name) && paramTypeMap[tree.name]) {
      return `<div class="editor-token editor-token-param"><div class="token-label">${symbolDisplay(tree.name)}</div><div style="margin-top:3px">${renderGeckoType(paramTypeMap[tree.name])}</div></div>`;
    }
    return `<div class="editor-token editor-token-op"><div class="token-label">${symbolDisplay(tree.name)}</div></div>`;
  }

  if (tree.type === 'app') {
    const { head, args } = flattenAppTree(tree);

    if (head && head.type === 'comp') {
      const desugared = desugarComp(head, args);
      if (desugared) return renderExprTreeGecko(desugared, funcSigMap, paramTypeMap, bareFuncs, params);
    }

    if (head && head.type === 'leaf' && funcSigMap[head.name]) {
      // Try to flatten into a merged chain
      const chain = flattenExprChain(tree, funcSigMap, paramTypeMap, bareFuncs, params);
      if (chain && chain.length > 1) {
        const children = chain.map(step => {
          const gecko = renderGeckoType(step.type);
          return `<div style="display:inline-flex;flex-direction:column;align-items:center">
            <div class="editor-slot-label ${step.cls}">${symbolDisplay(step.label)}</div>${gecko}</div>`;
        }).join('');
        return `<div class="gecko-arrow"><div class="gecko-arrow-inner">
          <div class="gecko-arrow-header">${geckoChevron}</div>
          <div class="gecko-arrow-body">${children}</div>
        </div></div>`;
      }

      return renderFuncAppGecko(head.name, funcSigMap[head.name], args, funcSigMap, paramTypeMap, bareFuncs, params, false);
    }

    let html = renderExprTreeGecko(head, funcSigMap, paramTypeMap, bareFuncs, params);
    for (const a of args) html += renderExprTreeGecko(a, funcSigMap, paramTypeMap, bareFuncs, params);
    return html;
  }

  if (tree.type === 'comp') {
    return renderExprTreeGecko(tree.left, funcSigMap, paramTypeMap, bareFuncs, params) +
      `<div class="editor-token editor-token-op"><div class="token-label">${symbolDisplay('.')}</div></div>` +
      renderExprTreeGecko(tree.right, funcSigMap, paramTypeMap, bareFuncs, params);
  }

  if (tree.type === 'binop') {
    return renderExprTreeGecko(tree.left, funcSigMap, paramTypeMap, bareFuncs, params) +
      `<div class="editor-token editor-token-op"><div class="token-label">${symbolDisplay(tree.op)}</div></div>` +
      renderExprTreeGecko(tree.right, funcSigMap, paramTypeMap, bareFuncs, params);
  }

  return '';
}

function renderFuncAppGecko(funcName, funcSig, args, funcSigMap, paramTypeMap, bareFuncs, params, nested) {
  const funcType = parseType(funcSig);
  // Decompose arrow into parts: [input1, input2, ..., result]
  const parts = [];
  let cur = funcType;
  while (cur.tag === 'fun') {
    parts.push(cur.from);
    cur = cur.to;
  }
  parts.push(cur); // result type

  const fullyApplied = args.length >= parts.length - 1;

  if (fullyApplied) {
    // All slots filled — render as nested gecko node wrapping arg slots
    const argsGecko = args.map((a, i) => renderArgSlot(a, parts[i], funcSigMap, paramTypeMap, bareFuncs, params)).join('');
    const abbrev = funcName.length > 2 ? funcName.slice(0, 2) : funcName;
    const nodeHtml = geckoNode(abbrev, '#93c5fd', '#1e40af', argsGecko);
    if (nested) return nodeHtml;
    return `<div class="editor-token editor-token-func"><div class="token-label">${symbolDisplay(funcName)}</div><div style="margin-top:3px">${nodeHtml}</div></div>`;
  }

  // Partially applied — show arrow with filled and unfilled slots
  const children = parts.map((part, i) => {
    if (i < args.length) {
      return renderArgSlot(args[i], part, funcSigMap, paramTypeMap, bareFuncs, params);
    }
    return renderGeckoType(part);
  }).join('');

  const arrowHtml = `<div class="gecko-arrow"><div class="gecko-arrow-inner">
    <div class="gecko-arrow-header">${geckoChevron}</div>
    <div class="gecko-arrow-body">${children}</div>
  </div></div>`;

  if (nested) {
    return `<div style="display:inline-flex;flex-direction:column;align-items:center">
      <div class="editor-slot-label editor-slot-func">${symbolDisplay(funcName)}</div>${arrowHtml}</div>`;
  }
  return `<div class="editor-token editor-token-func"><div class="token-label">${symbolDisplay(funcName)}</div><div style="margin-top:3px">${arrowHtml}</div></div>`;
}

function renderArgSlot(argTree, slotType, funcSigMap, paramTypeMap, bareFuncs, params) {
  if (!argTree) return renderGeckoType(slotType);

  if (argTree.type === 'leaf') {
    if (params.has(argTree.name) && paramTypeMap[argTree.name]) {
      // Param — show type block with name label
      const gecko = renderGeckoType(paramTypeMap[argTree.name]);
      return `<div style="display:inline-flex;flex-direction:column;align-items:center">
        <div class="editor-slot-label editor-slot-param">${symbolDisplay(argTree.name)}</div>${gecko}</div>`;
    }
    if (bareFuncs.has(argTree.name) && funcSigMap[argTree.name]) {
      // Unapplied function as argument — show its full arrow
      return `<div style="display:inline-flex;flex-direction:column;align-items:center">
        <div class="editor-slot-label editor-slot-func">${symbolDisplay(argTree.name)}</div>${renderGeckoType(parseType(funcSigMap[argTree.name]))}</div>`;
    }
    return renderGeckoType(slotType);
  }

  if (argTree.type === 'app') {
    const { head, args } = flattenAppTree(argTree);

    // Handle composition as head
    if (head && head.type === 'comp') {
      const desugared = desugarComp(head, args);
      if (desugared) return renderArgSlot(desugared, slotType, funcSigMap, paramTypeMap, bareFuncs, params);
    }

    if (head && head.type === 'leaf' && funcSigMap[head.name]) {
      return renderFuncAppGecko(head.name, funcSigMap[head.name], args, funcSigMap, paramTypeMap, bareFuncs, params, true);
    }
  }

  // Fallback: render slot type
  return renderGeckoType(slotType);
}

function updateLineNumbers() {
  const editor = document.getElementById('code-editor');
  const lineNums = document.getElementById('line-numbers');
  if (!editor || !lineNums) return;
  const lines = editor.value.split('\n').length;
  lineNums.innerHTML = Array.from({length: lines}, (_, i) => i + 2).join('<br>');
}

function renderGeckoLeafVar(name) {
  return geckoLeaf(name, varColor, 'black');
}

function runLiveCheck() {
  const code = getCodeFromEditor();
  const level = LEVELS[currentLevel];
  updateFunctionPalette(level, code);
  updateParameterPalette(level, code);
  const inferredEl = document.getElementById('inferred-type');
  const geckoEl = document.getElementById('inferred-gecko');
  const hintEl = document.getElementById('syntax-hint');
  const statusBar = document.getElementById('status-bar');
  const statusOutput = document.getElementById('status-output');

  if (!code || code === 'undefined') {
    if (inferredEl) inferredEl.innerHTML = renderTypeSig(level.lhs.trim().split(/\s+/)[0], 'a');
    if (geckoEl) geckoEl.innerHTML = renderGeckoLeafVar('a');
    if (hintEl) {
      hintEl.textContent = 'Your definition has valid syntax. Completion also requires the target type and exactly the supplied copies of each function.';
      hintEl.className = 'syntax-hint';
    }
    if (statusBar) { statusBar.className = 'status-bar checking'; statusBar.textContent = 'Status: Init'; }
    if (statusOutput) statusOutput.textContent = 'You did not make any changes.';
    return;
  }

  const rowError = getRowError();
  const result = rowError ? { valid: false, error: rowError } : liveInfer(level, code);

  if (result.valid && result.typeSig) {
    if (inferredEl) inferredEl.innerHTML = renderTypeSig(level.lhs.trim().split(/\s+/)[0], result.typeSig);
    if (geckoEl) {
      try { geckoEl.innerHTML = renderGeckoArrow(result.typeSig); } catch(e) {}
    }
    if (hintEl) {
      hintEl.textContent = 'Your definition has valid syntax. Completion also requires the target type and exactly the supplied copies of each function.';
      hintEl.className = 'syntax-hint';
    }
    const solution = checkSolution(level, code);
    if (statusBar) {
      statusBar.className = 'status-bar ' + (solution.ok ? 'success' : 'error');
      statusBar.textContent = solution.ok ? 'Status: Success!' : 'Status: Not solved';
    }
    if (statusOutput) {
      statusOutput.textContent = solution.msg;
      if (solution.ok) statusOutput.innerHTML += `<details><summary>Show reference rows</summary><pre>${escHtml(level.solution)}</pre></details>`;
    }
    if (solution.ok) recordCompletion();
  } else {
    if (inferredEl) inferredEl.innerHTML = renderTypeSig(level.lhs.trim().split(/\s+/)[0], 'a');
    if (geckoEl) geckoEl.innerHTML = renderGeckoLeafVar('a');
    if (hintEl) {
      hintEl.textContent = result.error || 'Your definition has a syntax or type error.';
      hintEl.className = 'syntax-hint invalid';
    }
    if (statusBar) { statusBar.className = 'status-bar error'; statusBar.textContent = 'Status: Error'; }
    if (statusOutput) statusOutput.textContent = result.error || 'Type error in expression.';
  }
}

function renderTypeSig(name, sig, displayName = symbolDisplay(name)) {
  if (iconMode) return `<span class="type-name">${displayName}</span>`;
  return `<span class="type-name">${displayName}</span> <span style="color:#374151">::</span> ${colorizeType(sig)}`;
}

function colorizeType(sig) {
  const tokens = tokenize(sig);
  return tokens.map(t => {
    if (t === '->') return '<span class="arrow">&rarr;</span>';
    if (t === '=>') return '<span class="arrow">&rArr;</span>';
    if (t === '(' || t === ')') return `<span class="type-paren">${t}</span>`;
    if (t === ',') return '<span class="type-paren">,</span>';
    if (t[0] >= 'A' && t[0] <= 'Z' || t === '()') return `<span class="type-con">${symbolDisplay(t)}</span>`;
    return `<span class="type-var">${escHtml(t)}</span>`;
  }).join(' ');
}

// Gecko graph rendering
const geckoColors = {
  'Zero': 'rgb(61,143,61)',
  'Hero': 'rgb(143,61,102)',
  '(,)': 'rgb(61,102,143)',
  '(,,)': 'rgb(102,61,143)',
  '->': '#959595',
  '()': 'rgb(180,180,180)',
};
const varColor = 'rgb(239,177,177)';

// Render type patterns from each level's actual signatures, including function arguments.
const { icons: LEVEL_ICONS, cardIcons: FUNCTION_CARD_ICONS, renderType: renderSemanticType, transformation: renderSemanticTransformation, fixedType: fixedSemanticType, fit: fitSemanticDiagrams } =
  createSemanticIcons(LEVELS, parseType, flattenApp, typeToString);

function symbolDisplay(name, fallbackHtml, fixedWidthCh) {
  if (!iconMode) return fallbackHtml != null ? fallbackHtml : escHtml(name);
  const semantic = LEVEL_ICONS[LEVELS[currentLevel].level]?.[name];
  const svg = semantic;
  if (!svg) return fallbackHtml != null ? fallbackHtml : escHtml(name);
  const w = fixedWidthCh ? `width:${fixedWidthCh}ch;` : '';
  return `<span class="icon-sym${semantic ? ' semantic-icon' : ''}" title="${escHtml(name)}" style="${w}">${svg}</span>`;
}

function renderGeckoArrow(sig) {
  const type = parseType(sig);
  if (!type) return '';
  return renderGeckoType(type);
}

function renderGeckoType(type) {
  if (!type) return '';
  switch (type.tag) {
    case 'var':
      return geckoLeaf(type.name, varColor, 'black');
    case 'con':
      return geckoLeaf(type.name, geckoColors[type.name] || '#888', 'white');
    case 'fun': {
      // Arrow type: render as gecko arrow block
      const parts = [];
      let cur = type;
      while (cur.tag === 'fun') {
        parts.push(cur.from);
        cur = cur.to;
      }
      parts.push(cur);
      const chevron = `<svg viewBox="0 0 39 18" fill="white" style="height:10px"><path d="M1 1H7L15.5 9H9.5L1 1Z"/><path d="M1 17H7L15.5 9H9.5L1 17Z"/><path d="M12.5 1H18.5L27 9H21L12.5 1Z"/><path d="M12.5 17H18.5L27 9H21L12.5 17Z"/><path d="M24 1H30L38.5 9H32.5L24 1Z"/><path d="M24 17H30L38.5 9H32.5L24 17Z"/></svg>`;
      const children = parts.map((p, i) => renderGeckoType(p)).join('');
      return `<div class="gecko-arrow"><div class="gecko-arrow-inner">
        <div class="gecko-arrow-header">${chevron}</div>
        <div class="gecko-arrow-body">${children}</div>
      </div></div>`;
    }
    case 'app': {
      const flat = flattenApp(type);
      const name = flat.head.tag === 'con' ? flat.head.name : (flat.head.tag === 'var' ? flat.head.name : '?');
      // Check for tuple
      if (flat.head.tag === 'con' && flat.head.name.startsWith('(') && flat.head.name.endsWith(')')) {
        const color = geckoColors[flat.head.name] || '#888';
        const abbrev = flat.head.name.length <= 3 ? flat.head.name : flat.head.name.slice(0, 3);
        const children = flat.args.map(a => renderGeckoType(a)).join('');
        return geckoNode(abbrev, color, 'white', children);
      }
      const color = geckoColors[name] || (flat.head.tag === 'var' ? varColor : '#888');
      const textColor = flat.head.tag === 'var' ? 'black' : 'white';
      const abbrev = name.length > 2 ? name.slice(0, 2) : name;
      const children = flat.args.map(a => renderGeckoType(a)).join('');
      return geckoNode(abbrev, color, textColor, children);
    }
  }
  return '';
}

function geckoLeaf(label, bgColor, textColor) {
  return `<div class="gecko-wrap"><div class="gecko-inner" style="background:${bgColor}">
    <div class="gecko-header"></div>
    <div class="gecko-body" style="color:${textColor}">${symbolDisplay(label)}</div>
  </div></div>`;
}

function geckoNode(label, bgColor, textColor, childrenHtml) {
  return `<div class="gecko-wrap"><div class="gecko-inner" style="background:${bgColor}">
    <div class="gecko-header"></div>
    <div style="display:flex">
      <div class="gecko-body" style="color:${textColor};min-width:24px">${symbolDisplay(label)}</div>
      <div class="gecko-children">${childrenHtml}</div>
    </div>
  </div></div>`;
}

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ─── Actions ───

function recordCompletion() {
  if (!completedLevels.has(currentLevel)) {
    completedLevels.add(currentLevel);
    saveProgress();
  }
  const next = document.getElementById('next-level');
  if (next) { next.hidden = false; next.textContent = nextLevelLabel(); }
  const skip = document.getElementById('skip-level');
  if (skip) skip.hidden = true;
  const badge = document.getElementById('level-badge');
  if (badge) badge.innerHTML = `<span title="Solved" style="color:#22c55e">&#10003; </span>${levelProgressLabel()}`;
}

window.nextLevel = function() {
  if (!completedLevels.has(currentLevel)) return;
  if (currentLevel === LEVEL_ORDER.at(-1)) {
    const unsolved = LEVEL_ORDER.find(index => !completedLevels.has(index));
    if (unsolved === undefined) showComplete = true;
    else currentLevel = unsolved;
  } else currentLevel = LEVEL_ORDER[LEVEL_ORDER.indexOf(currentLevel) + 1];
  saveProgress();
  render();
};

window.skipLevel = function() {
  const position = LEVEL_ORDER.indexOf(currentLevel);
  if (completedLevels.has(currentLevel) || position >= LEVEL_ORDER.length - 1) return;
  clearTimeout(liveCheckTimer);
  currentLevel = LEVEL_ORDER[position + 1];
  activeRow = 0;
  saveProgress();
  render();
};

window.clearLevel = function() {
  clearTimeout(liveCheckTimer);
  showComplete = false;
  completedLevels.delete(currentLevel);
  delete editorContents[currentLevel];
  delete rowPrograms[currentLevel];
  delete textDrafts[currentLevel];
  textHistory.delete(currentLevel);
  rowHistory.delete(currentLevel);
  activeRow = 0;
  saveProgress();
  render();
};

window.resetGame = function() {
  showComplete = false;
  currentLevel = LEVEL_ORDER[0];
  completedLevels.clear();
  editorContents = {};
  rowPrograms = {};
  textDrafts = {};
  textHistory.clear();
  clearRowHistory();
  saveProgress();
  render();
};

window.toggleGecko = function() {
  geckoOn = !geckoOn;
  saveProgress();
  render();
};

window.toggleIconMode = function() {
  iconMode = !iconMode;
  saveProgress();
  render();
};

window.showAboutDialog = function() {
  showAbout = true;
  render();
};

window.dismissAbout = function() {
  showAbout = false;
  render();
};

window.prevLevel = function() {
  const position = LEVEL_ORDER.indexOf(currentLevel);
  if (position > 0) {
    currentLevel = LEVEL_ORDER[position - 1];
    saveProgress();
    render();
  }
};

// Save progress on editor blur and page unload instead of every keystroke
window.addEventListener('beforeunload', saveProgress);

// Initial render
render();
</script>
